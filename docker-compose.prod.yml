# Production stack: the API, the worker, PostgreSQL and Redis, built from api/Dockerfile.
#
#   docker compose -f docker-compose.prod.yml --env-file .env.production up -d --build
#
# Every variable is listed in .env.example. Generate passwords with `openssl rand -hex 32`: they
# are placed in connection URLs, so they must not contain URL syntax characters.
#
# PostgreSQL and Redis publish no ports. The web container (nginx) serves the app and forwards /api
# to the API, so browsers use one origin; put the TLS-terminating reverse proxy in front of it, on
# 127.0.0.1:WEB_PORT. The API also listens on 127.0.0.1:API_PORT for direct use. Requests through
# the web container cross two proxies (TLS proxy, nginx): set TRUST_PROXY_HOPS=2 there, and
# CORS_ORIGINS to the public origin of the web app. The API and the worker connect to
# PostgreSQL as APP_DB_USER, which cannot change the schema; only the one-shot migrate service
# uses the owner role (deploy/postgres/10-app-role.sh).
name: checkpoint-prod

x-app: &app
  image: checkpoint-api
  build:
    context: ./api
    target: runtime
  restart: unless-stopped
  read_only: true
  tmpfs: [/tmp]
  security_opt: ['no-new-privileges:true']
  cap_drop: [ALL]
  environment:
    NODE_ENV: production
    LOG_LEVEL: ${LOG_LEVEL:-info}
    CORS_ORIGINS: ${CORS_ORIGINS:?set CORS_ORIGINS}
    TRUST_PROXY_HOPS: ${TRUST_PROXY_HOPS:-1}
    ENABLE_DOCS: ${ENABLE_DOCS:-false}
    DATABASE_URL: postgresql://${APP_DB_USER:?set APP_DB_USER}:${APP_DB_PASSWORD:?set APP_DB_PASSWORD}@postgres:5432/${POSTGRES_DB:?set POSTGRES_DB}
    REDIS_URL: redis://:${REDIS_PASSWORD:?set REDIS_PASSWORD}@redis:6379
    JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET}
    METRICS_TOKEN: ${METRICS_TOKEN:-}
    SENTRY_DSN: ${SENTRY_DSN:-}
  depends_on:
    migrate:
      condition: service_completed_successfully
    redis:
      condition: service_healthy

services:
  postgres:
    image: postgres:18.6-alpine@sha256:10a5c69a83035ab5239f5620d708520e8b28f5aa1f2b20143e6024532edadfb5
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB}
      APP_DB_USER: ${APP_DB_USER:?set APP_DB_USER}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?set APP_DB_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./deploy/postgres/10-app-role.sh:/docker-entrypoint-initdb.d/10-app-role.sh:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:8.10.3-alpine@sha256:71885d8cc6e42f2bc0aa2eb853bfc4be200b5108a46ac50e117ae1df0531fb80
    restart: unless-stopped
    command: ['redis-server', '--requirepass', '${REDIS_PASSWORD:?set REDIS_PASSWORD}']
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD}
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  # Applies pending migrations as the schema owner, then exits. The API and the worker wait for it.
  migrate:
    image: checkpoint-migrate
    build:
      context: ./api
      target: migrate
    restart: 'no'
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    depends_on:
      postgres:
        condition: service_healthy

  api:
    <<: *app
    ports:
      - '127.0.0.1:${API_PORT:-3000}:3000'

  web:
    image: checkpoint-web
    build:
      context: ./web
    restart: unless-stopped
    read_only: true
    # nginx writes its pid and temporary files to /tmp and renders its config into conf.d. A tmpfs
    # takes the owner of the image's directory (root for conf.d), so it is mounted for nginx's
    # uid; otherwise the template is not rendered and nginx starts listening on nothing.
    tmpfs: [/tmp, '/etc/nginx/conf.d:uid=101,gid=101']
    security_opt: ['no-new-privileges:true']
    cap_drop: [ALL]
    environment:
      API_UPSTREAM: http://api:3000
    ports:
      - '127.0.0.1:${WEB_PORT:-8080}:8080'
    # Serving the app, not only running: `up --wait` then fails when nginx has no server.
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O', '/dev/null', 'http://127.0.0.1:8080/']
      interval: 10s
      timeout: 3s
      start_period: 10s
      retries: 3
    depends_on:
      api:
        condition: service_healthy

  worker:
    <<: *app
    command: ['node', 'dist/worker.js']
    # No HTTP server in the worker: the image's health check does not apply.
    healthcheck:
      disable: true

  # Loads the bundled Steam snapshot, the two demo accounts and their reviews, then exits. Safe to
  # run again. Only on demand, for a local or demo stack:
  #   docker compose -f docker-compose.prod.yml --profile seed run --rm seed
  seed:
    image: checkpoint-api
    profiles: [seed]
    restart: 'no'
    read_only: true
    tmpfs: [/tmp]
    security_opt: ['no-new-privileges:true']
    cap_drop: [ALL]
    command: ['node', 'dist/cli/seed.js']
    environment:
      DATABASE_URL: postgresql://${APP_DB_USER}:${APP_DB_PASSWORD}@postgres:5432/${POSTGRES_DB}
      # Not required here: Compose interpolates every service, even ones in an inactive profile,
      # and a production stack has no use for it. The seed itself refuses an empty password.
      SEED_DEMO_PASSWORD: ${SEED_DEMO_PASSWORD:-}
    healthcheck:
      disable: true
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  postgres-data:
  redis-data:
