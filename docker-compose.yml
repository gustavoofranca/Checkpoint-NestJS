# Local development. Ports bind to 127.0.0.1 only. PostgreSQL uses host port 5433 so it does not
# collide with a PostgreSQL already running on the default 5432.
name: checkpoint

services:
  postgres:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
    ports:
      - '127.0.0.1:5433:5432'
    volumes:
      # PostgreSQL 18 images keep data in a versioned subdirectory of /var/lib/postgresql.
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:8.10.2-alpine
    command: ['redis-server', '--requirepass', '${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}']
    environment:
      # Read by redis-cli in the health check, so the password is not on its command line.
      REDISCLI_AUTH: ${REDIS_PASSWORD}
    ports:
      - '127.0.0.1:6379:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  # The queue worker (src/worker.ts), run from the host's build: `npm run build` in api/ first,
  # then `docker compose --profile worker up -d`. Production runs it from the image built by
  # api/Dockerfile (docker-compose.prod.yml).
  worker:
    profiles: [worker]
    image: node:26.12.0-bookworm-slim
    user: node
    working_dir: /app
    command: ['node', 'dist/worker.js']
    volumes:
      - ./api:/app:ro
    env_file: .env
    environment:
      # Inside the Compose network the services are reached by name, on their own ports.
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres-data:
  redis-data:
